name: Upstream sync

# Every Monday: bring the newest work of the original Kapowarr (its development branch) into this copy.
# If it merges cleanly and the tests pass, a pull request is opened. If not, an issue says what to look at.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - name: Fetch the original
        run: |
          git remote add upstream https://github.com/Casvt/Kapowarr.git
          git fetch upstream development
          if git merge-base --is-ancestor upstream/development HEAD; then
            echo "UPTODATE=1" >> "$GITHUB_ENV"; echo "Already up to date with the original."
          fi
      - name: Merge
        if: env.UPTODATE != '1'
        run: |
          git config user.name "upstream-sync"; git config user.email "upstream-sync@users.noreply.github.com"
          git checkout -b upstream-sync
          if git merge --no-edit upstream/development; then echo "MERGED=1" >> "$GITHUB_ENV"; else git merge --abort; fi
      - name: Test
        if: env.MERGED == '1'
        run: |
          pip install -r requirements.txt
          mkdir -p db
          python -m unittest discover -s tests/Tbackend -p '*.py' -t . && echo "TESTED=1" >> "$GITHUB_ENV"
      - name: Open a pull request
        if: env.TESTED == '1'
        run: |
          git push --force origin upstream-sync
          gh pr list --head upstream-sync --state open --json number --jq 'length' | grep -q '^0$' || { echo "A pull request is already open."; exit 0; }
          gh pr create --head upstream-sync --base main --title "Bring in the original's newest work" \
            --body "The original Kapowarr has new commits. They merged cleanly and the tests pass. Check the database migrations (backend/internals/db_migration.py) before merging: version numbers must stay in order after the bridge and step 52."
      - name: Open an issue if it did not merge or the tests failed
        if: env.UPTODATE != '1' && env.TESTED != '1'
        run: |
          gh issue list --label upstream-sync --state open --json number --jq 'length' | grep -q '^0$' || exit 0
          gh label create upstream-sync --color eac700 --description "The original has new work that needs a hand" 2>/dev/null || true
          gh issue create --label upstream-sync --title "The original has new work that does not merge cleanly" \
            --body "Run: git fetch upstream development && git merge upstream/development, fix the conflicts, run the tests, and check the migrations."
