name: CI

# Every push and pull request runs the tests. A push to main then builds the image for Intel/AMD and ARM
# and publishes it to ghcr.io/hikki-dev/kapowarr-fork.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the tests (all of them work offline)
        run: |
          mkdir -p db
          python -m unittest discover -s tests/Tbackend -p '*.py' -t .

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/hikki-dev/kapowarr-fork:latest
            ghcr.io/hikki-dev/kapowarr-fork:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
