services:
  kapowarr:
    container_name: kapowarr
    image: ghcr.io/hikki-dev/kapowarr-fork:latest
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: 50m, max-file: "3" }
    environment:
      - PUID=0
      - PGID=0
      - TZ=UTC
    volumes:
      - "kapowarr-db:/app/db"
      - "/path/to/downloads:/app/temp_downloads"
      - "/path/to/comics:/comics-1"
    ports:
      - 5656:5656

volumes:
  kapowarr-db:
